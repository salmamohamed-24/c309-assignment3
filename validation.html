<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Account Setup</title>
  <style>
    :root {
      --primary: #0f766e;
      --primary-hover: #115e59;
      --danger: #b91c1c;
      --success: #15803d;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #cbd5e1;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: #0f172a;
      margin: 0;
      padding: 40px 15px;
    }

    .wrapper {
      max-width: 480px;
      margin: 0 auto;
    }

    .header-group {
      text-align: center;
      margin-bottom: 24px;
    }

    .header-group h2 {
      margin: 0 0 8px 0;
      font-size: 24px;
      letter-spacing: -0.5px;
    }

    .header-group p {
      margin: 0;
      color: #64748b;
      font-size: 14px;
    }

    .app-form {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .form-row {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #334155;
    }

    .text-input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      font-size: 14px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .text-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
    }

    .field-hint {
      color: var(--danger);
      font-size: 12px;
      margin: 5px 0 0 0;
    }

    .is-invalid {
      border-color: var(--danger) !important;
      background-color: #fef2f2;
    }

    .is-valid {
      border-color: var(--success) !important;
      background-color: #f0fdf4;
    }

    .d-none {
      display: none;
    }

    .alert-box {
      padding: 12px 16px;
      margin-bottom: 20px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
    }

    .alert-danger {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: var(--danger);
    }

    .alert-success {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: var(--success);
    }

    .visibility-toggle {
      background: transparent;
      border: none;
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 0 0 6px 0;
      display: inline-block;
    }

    .btn-submit {
      width: 100%;
      padding: 11px;
      font-size: 14px;
      font-weight: 600;
      background-color: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }
  </style>
</head>

<body>

  <div class="wrapper">
    <div class="header-group">
      <h2>Create New Account</h2>
      <p>Submit your basic profile details for verification</p>
    </div>

    <div id="statusAlert" class="d-none" role="alert"></div>

    <form id="signupForm" class="app-form" novalidate>
      <div class="form-row">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" class="text-input" placeholder="e.g. Aly Mahmoud">
        <p id="errFullName" class="field-hint d-none"></p>
      </div>

      <div class="form-row">
        <label for="userEmail">Email Address</label>
        <input type="email" id="userEmail" class="text-input" placeholder="user@domain.com">
        <p id="errUserEmail" class="field-hint d-none"></p>
      </div>

      <div class="form-row">
        <label for="userPass">Master Password</label>
        <button type="button" id="pwdToggleBtn" class="visibility-toggle">View Password</button>
        <input type="password" id="userPass" class="text-input" placeholder="Min. 8 characters">
        <p id="errUserPass" class="field-hint d-none"></p>
      </div>

      <div class="form-row">
        <label for="confirmPass">Re-enter Password</label>
        <input type="password" id="confirmPass" class="text-input" placeholder="Confirm master password">
        <p id="errConfirmPass" class="field-hint d-none"></p>
      </div>

      <div class="form-row">
        <label for="userAge">Age (Years)</label>
        <input type="number" id="userAge" class="text-input" placeholder="18 - 120">
        <p id="errUserAge" class="field-hint d-none"></p>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">Create Account</button>
    </form>
  </div>

  <script src="JS/validation.js"></script>
</body>

</html>
